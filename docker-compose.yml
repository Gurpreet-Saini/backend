version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ams-db
    environment:
      POSTGRES_DB: attendancemgmt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: ams-backend
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://postgres:postgrespassword@db:5432/attendancemgmt?sslmode=disable
      - JWT_SECRET=change-this-in-production-123456
      - PORT=8080
      - ENV=production
    depends_on:
      - db

volumes:
  postgres_data:
