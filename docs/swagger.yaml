basePath: /
definitions:
  handlers.CheckInReq:
    properties:
      department_id:
        type: integer
      sewadar_id:
        type: integer
    required:
    - sewadar_id
    type: object
  handlers.FeedbackRequest:
    properties:
      message:
        type: string
      subject:
        type: string
    required:
    - message
    - subject
    type: object
  handlers.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handlers.StockUpdateReq:
    properties:
      quantity_changed:
        type: integer
      remarks:
        type: string
      transaction_type:
        type: string
    required:
    - quantity_changed
    - transaction_type
    type: object
  models.Attendance:
    properties:
      check_in:
        type: string
      check_out:
        type: string
      created_at:
        type: string
      date:
        type: string
      department:
        $ref: '#/definitions/models.Department'
      department_id:
        type: integer
      id:
        type: integer
      marked_by:
        type: integer
      marked_by_user:
        $ref: '#/definitions/models.User'
      sewadar:
        $ref: '#/definitions/models.Sewadar'
      sewadar_id:
        type: integer
      updated_at:
        type: string
    type: object
  models.Center:
    properties:
      created_at:
        type: string
      departments:
        items:
          $ref: '#/definitions/models.Department'
        type: array
      id:
        type: integer
      location:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  models.Department:
    properties:
      center:
        $ref: '#/definitions/models.Center'
      center_id:
        type: integer
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      sewadars:
        items:
          $ref: '#/definitions/models.Sewadar'
        type: array
      updated_at:
        type: string
    type: object
  models.Feedback:
    properties:
      created_at:
        type: string
      id:
        type: integer
      is_read:
        type: boolean
      message:
        type: string
      subject:
        type: string
      updated_at:
        type: string
      user:
        $ref: '#/definitions/models.User'
      user_id:
        type: integer
    type: object
  models.InventoryTransaction:
    properties:
      created_at:
        type: string
      id:
        type: integer
      item:
        $ref: '#/definitions/models.Item'
      item_id:
        type: integer
      marked_by:
        type: integer
      marked_by_user:
        $ref: '#/definitions/models.User'
      quantity_changed:
        type: integer
      remarks:
        type: string
      transaction_type:
        $ref: '#/definitions/models.TransactionType'
      updated_at:
        type: string
    type: object
  models.Item:
    properties:
      category:
        type: string
      center:
        $ref: '#/definitions/models.Center'
      center_id:
        type: integer
      created_at:
        type: string
      department:
        $ref: '#/definitions/models.Department'
      department_id:
        type: integer
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      quantity:
        type: integer
      unit:
        type: string
      updated_at:
        type: string
    type: object
  models.Sewadar:
    properties:
      attendance:
        items:
          $ref: '#/definitions/models.Attendance'
        type: array
      badge_status:
        type: string
      center:
        $ref: '#/definitions/models.Center'
      center_id:
        type: integer
      created_at:
        type: string
      department:
        $ref: '#/definitions/models.Department'
      department_id:
        type: integer
      email:
        type: string
      gender:
        type: string
      id:
        type: integer
      name:
        type: string
      parent_spouse_name:
        type: string
      phone:
        type: string
      sewadar_id:
        type: string
      updated_at:
        type: string
      uuid:
        type: string
    type: object
  models.TransactionType:
    enum:
    - ADD
    - SUBTRACT
    - SET
    type: string
    x-enum-varnames:
    - TransactionTypeAdd
    - TransactionTypeSubtract
    - TransactionTypeSet
  models.User:
    properties:
      center:
        $ref: '#/definitions/models.Center'
      center_id:
        type: integer
      created_at:
        type: string
      department:
        $ref: '#/definitions/models.Department'
      department_id:
        description: scoped for operator/viewer
        type: integer
      id:
        type: integer
      role:
        $ref: '#/definitions/models.UserRole'
      updated_at:
        type: string
      username:
        type: string
    type: object
  models.UserRole:
    enum:
    - super_admin
    - center_admin
    - operator
    - dept_viewer
    type: string
    x-enum-varnames:
    - RoleSuperAdmin
    - RoleCenterAdmin
    - RoleOperator
    - RoleDeptViewer
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API for managing centers, departments, sewadars, and attendance.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Attendance Management System API
  version: "1.0"
paths:
  /api/attendance:
    get:
      consumes:
      - application/json
      description: Get a list of attendance records with filtering
      parameters:
      - description: Center ID filter
        in: query
        name: center_id
        type: integer
      - description: Department ID filter
        in: query
        name: department_id
        type: integer
      - description: Sewadar ID filter
        in: query
        name: sewadar_id
        type: integer
      - description: Date from (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: Date to (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Attendance'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List attendance records
      tags:
      - attendance
  /api/attendance/{id}:
    put:
      consumes:
      - application/json
      description: Update an existing attendance record (CenterAdmin only)
      parameters:
      - description: Attendance ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated attendance details
        in: body
        name: attendance
        required: true
        schema:
          $ref: '#/definitions/models.Attendance'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Attendance'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update attendance record
      tags:
      - attendance
  /api/attendance/{id}/check-out:
    put:
      consumes:
      - application/json
      description: Mark attendance as checked-out for a sewadar
      parameters:
      - description: Attendance ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Attendance'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Check-out a sewadar
      tags:
      - attendance
  /api/attendance/check-in:
    post:
      consumes:
      - application/json
      description: Mark attendance as checked-in for a sewadar
      parameters:
      - description: Check-in details
        in: body
        name: checkin
        required: true
        schema:
          $ref: '#/definitions/handlers.CheckInReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Attendance'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Check-in a sewadar
      tags:
      - attendance
  /api/attendance/export:
    get:
      consumes:
      - application/json
      description: Export filtered attendance records to an Excel file
      parameters:
      - description: Center ID filter
        in: query
        name: center_id
        type: integer
      - description: Department ID filter
        in: query
        name: department_id
        type: integer
      - description: Date from (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: Date to (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      produces:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        "200":
          description: Excel file
          schema:
            type: file
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Export attendance to Excel
      tags:
      - attendance
  /api/centers:
    get:
      consumes:
      - application/json
      description: Get a list of all centers
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Center'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all centers
      tags:
      - centers
    post:
      consumes:
      - application/json
      description: Create a new center (SuperAdmin only)
      parameters:
      - description: Center details
        in: body
        name: center
        required: true
        schema:
          $ref: '#/definitions/models.Center'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Center'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a center
      tags:
      - centers
  /api/centers/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a center and its associated data (SuperAdmin only)
      parameters:
      - description: Center ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a center
      tags:
      - centers
    put:
      consumes:
      - application/json
      description: Update an existing center (SuperAdmin only)
      parameters:
      - description: Center ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated center details
        in: body
        name: center
        required: true
        schema:
          $ref: '#/definitions/models.Center'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Center'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a center
      tags:
      - centers
  /api/dashboard:
    get:
      consumes:
      - application/json
      description: Get summaries of attendance and sewadars for the dashboard
      parameters:
      - description: Center ID filter
        in: query
        name: center_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get dashboard statistics
      tags:
      - dashboard
  /api/departments:
    post:
      consumes:
      - application/json
      description: Create a new department (Admin/SuperAdmin only)
      parameters:
      - description: Department details
        in: body
        name: department
        required: true
        schema:
          $ref: '#/definitions/models.Department'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Department'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a department
      tags:
      - departments
  /api/departments/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a department (Admin/SuperAdmin only)
      parameters:
      - description: Department ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a department
      tags:
      - departments
    get:
      consumes:
      - application/json
      description: Get details of a specific department
      parameters:
      - description: Department ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Department'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get department by ID
      tags:
      - departments
    put:
      consumes:
      - application/json
      description: Update an existing department (Admin/SuperAdmin only)
      parameters:
      - description: Department ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated department details
        in: body
        name: department
        required: true
        schema:
          $ref: '#/definitions/models.Department'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Department'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a department
      tags:
      - departments
  /api/feedback:
    get:
      consumes:
      - application/json
      description: Get a list of all feedback messages (SuperAdmin only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Feedback'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all feedback
      tags:
      - feedback
    post:
      consumes:
      - application/json
      description: Submit a new feedback message from an authenticated user
      parameters:
      - description: Feedback details
        in: body
        name: feedback
        required: true
        schema:
          $ref: '#/definitions/handlers.FeedbackRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Feedback'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Submit feedback
      tags:
      - feedback
  /api/feedback/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a specific feedback message (SuperAdmin only)
      parameters:
      - description: Feedback ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete feedback
      tags:
      - feedback
  /api/feedback/{id}/read:
    put:
      consumes:
      - application/json
      description: Update the status of a feedback message to read (SuperAdmin only)
      parameters:
      - description: Feedback ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Mark feedback as read
      tags:
      - feedback
  /api/inventory:
    get:
      consumes:
      - application/json
      description: Get a list of all items, optionally filtered by center, department,
        or category.
      parameters:
      - description: Center ID filter
        in: query
        name: center_id
        type: integer
      - description: Department ID filter
        in: query
        name: department_id
        type: integer
      - description: Category filter
        in: query
        name: category
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Item'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all inventory items
      tags:
      - inventory
    post:
      consumes:
      - application/json
      description: Create a new inventory item
      parameters:
      - description: Item details
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/models.Item'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Item'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create an item
      tags:
      - inventory
  /api/inventory/{id}:
    delete:
      consumes:
      - application/json
      description: Delete an inventory item and its transaction history
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete an item
      tags:
      - inventory
    get:
      consumes:
      - application/json
      description: Get details of a specific item by its internal ID
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Item'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get item by ID
      tags:
      - inventory
    put:
      consumes:
      - application/json
      description: Update an existing inventory item
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated item details
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/models.Item'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Item'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update an item
      tags:
      - inventory
  /api/inventory/{id}/stock:
    post:
      consumes:
      - application/json
      description: Adjust stock of an item (ADD, SUBTRACT, SET)
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      - description: Stock transaction details
        in: body
        name: transaction
        required: true
        schema:
          $ref: '#/definitions/handlers.StockUpdateReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Modify item stock
      tags:
      - inventory
  /api/inventory/{id}/transactions:
    get:
      consumes:
      - application/json
      description: View transaction history for a specific item
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.InventoryTransaction'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List item transactions
      tags:
      - inventory
  /api/me:
    get:
